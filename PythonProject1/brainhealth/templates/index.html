<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Brain Health Prototype</title>
</head>
<body>
  <h2>Predict Cognitive Decline Risk</h2>
  <form id="predictForm">
    Age: <input type="number" name="age"><br><br>
    Memory Score: <input type="number" name="memory_score"><br><br>
    Genetic Marker:
    <select name="genetic_marker">
      <option value="0">No</option>
      <option value="1">Yes</option>
    </select><br><br>
    <button type="submit">Predict</button>
  </form>
  <h3 id="result"></h3>

  <script>
    document.getElementById("predictForm").onsubmit = async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData.entries());
      const res = await fetch("/predict/", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
      });
      const json = await res.json();
      if(json.prediction) {
        document.getElementById("result").innerText = "Prediction: " + json.prediction;
      } else {
        document.getElementById("result").innerText = "Error: " + (json.error || JSON.stringify(json));
      }
    }
  </script>
</body>
</html>
